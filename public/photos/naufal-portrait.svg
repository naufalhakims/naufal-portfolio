<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
  <title id="title">Naufal Hakim portrait</title>
  <desc id="desc">A framed portrait with acid green and blue accents.</desc>
  <defs>
    <clipPath id="portrait-frame">
      <rect x="42" y="32" width="636" height="820" rx="32" />
    </clipPath>
    <filter id="portrait-tone" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0.18" />
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.9" intercept="0.08" />
        <feFuncG type="linear" slope="0.9" intercept="0.08" />
        <feFuncB type="linear" slope="0.9" intercept="0.08" />
      </feComponentTransfer>
    </filter>
    <linearGradient id="acid-wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4ff3d" stop-opacity="0.14" />
      <stop offset="0.55" stop-color="#0a0a0a" stop-opacity="0" />
      <stop offset="1" stop-color="#0a0a0a" stop-opacity="0.28" />
    </linearGradient>
  </defs>

  <rect width="720" height="900" rx="42" fill="#151515" />
  <rect x="18" y="18" width="684" height="864" rx="48" fill="none" stroke="#d4ff3d" stroke-opacity="0.52" stroke-width="2" />
  <rect x="42" y="32" width="636" height="820" rx="32" fill="#2b2b2b" />
  <image
    href="/photos/naufal-portrait.jpg"
    x="42"
    y="32"
    width="636"
    height="820"
    preserveAspectRatio="xMidYMid slice"
    clip-path="url(#portrait-frame)"
    filter="url(#portrait-tone)"
  />
  <rect x="42" y="32" width="636" height="820" fill="url(#acid-wash)" clip-path="url(#portrait-frame)" />
  <circle cx="610" cy="112" r="38" fill="#d4ff3d" />
  <circle cx="610" cy="112" r="18" fill="#151515" />
  <path d="M74 790c28-38 62-55 102-55" fill="none" stroke="#d4ff3d" stroke-linecap="round" stroke-width="10" />
  <path d="M80 790c16-4 31-5 46-3" fill="none" stroke="#d4ff3d" stroke-linecap="round" stroke-width="4" />
</svg>
